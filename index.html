<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f6f3ec">

  <title>My Quran Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f6f3ec;
      --card: #ffffff;
      --text: #1d2925;
      --secondary: #6f7a75;
      --border: #e2ddd2;
      --accent: #315c4b;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .app {
      max-width: 700px;
      margin: auto;

      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    .hidden {
      display: none;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: var(--secondary);
      margin-top: 6px;
      margin-bottom: 22px;
    }

    .continue-card {
      background: var(--accent);
      color: white;

      border-radius: 18px;
      padding: 18px;

      margin-bottom: 22px;

      cursor: pointer;
    }

    .continue-small {
      opacity: 0.8;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .continue-title {
      font-size: 19px;
      font-weight: 600;
    }

    .surah-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .surah-row {
      display: flex;
      align-items: center;
      gap: 14px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 16px;

      padding: 15px;

      cursor: pointer;
    }

    .surah-number {
      width: 38px;
      height: 38px;

      border: 1px solid var(--border);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
    }

    .surah-text {
      flex: 1;
    }

    .surah-name {
      font-size: 17px;
      font-weight: 600;
    }

    .surah-meaning {
      color: var(--secondary);
      font-size: 13px;
      margin-top: 3px;
    }

    .surah-arabic {
      direction: rtl;
      font-size: 24px;
      font-family:
        "Geeza Pro",
        "Noto Naskh Arabic",
        serif;
    }

    .reader-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .back-button {
      border: 0;
      background: var(--card);

      width: 44px;
      height: 44px;

      border-radius: 50%;

      font-size: 22px;

      border: 1px solid var(--border);
    }

    .reader-heading {
      flex: 1;
    }

    .reader-arabic-name {
      direction: rtl;
      color: var(--secondary);
      margin-top: 3px;
    }

    .ayah {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 22px 18px;
      margin-bottom: 14px;
    }

    .arabic {
      direction: rtl;
      text-align: right;

      font-family:
        "Geeza Pro",
        "Noto Naskh Arabic",
        serif;

      font-size: 34px;
      line-height: 2;
    }

    .ayah-number {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 30px;
      height: 30px;

      border: 1px solid var(--border);
      border-radius: 50%;

      font-family: -apple-system, sans-serif;

      font-size: 12px;

      margin-right: 7px;
    }

    .empty-message {
      color: var(--secondary);
      text-align: center;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 30px 20px;
    }
    
    .source-footer {
      text-align: center;
      color: var(--secondary);
      font-size: 12px;
      line-height: 1.6;
      margin-top: 35px;
      padding: 20px;
    }
    
    .source-footer a {
      color: var(--accent);
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HOME SCREEN -->
    <section id="homeScreen">

      <h1>Quran</h1>

      <div class="subtitle">
        Choose a Surah to begin reading
      </div>

      <div
        id="continueCard"
        class="continue-card hidden"
        onclick="continueReading()"
      >
        <div class="continue-small">
          Continue Reading
        </div>

        <div
          id="continueTitle"
          class="continue-title"
        ></div>
      </div>

      <div
        id="surahList"
        class="surah-list"
      ></div>

    </section>


    <!-- READER SCREEN -->
    <section
      id="readerScreen"
      class="hidden"
    >

      <div class="reader-top">

        <button
          class="back-button"
          onclick="goHome()"
        >
          ‹
        </button>

        <div class="reader-heading">

          <h1 id="readerTitle">
            Surah
          </h1>

          <div
            id="readerArabicName"
            class="reader-arabic-name"
          ></div>

        </div>

      </div>

      <div id="ayahContainer"></div>

    </section>
    
    <footer class="source-footer">
    
      Quran text source:
      <a
        href="https://tanzil.net"
        target="_blank"
        rel="noopener"
      >
        Tanzil Project
      </a>
    
      <br>
    
      Tanzil Quran Text
      © 2007–2021 Tanzil Project
    
    </footer>
  
  </main>


  <script>

    const surahs = [

      ["Sad","Sad","ص",88],

      ["An-Naba","The Tidings","النبأ",40],

      ["Abasa","He Frowned","عبس",42],

      ["Al-Infitar","The Cleaving","الانفطار",19],
      ["Al-Mutaffifin","Defrauding","المطففين",36],
      ["Al-Inshiqaq","The Splitting Open","الانشقاق",25],
      ["Al-Buruj","The Mansions of the Stars","البروج",22],
      ["At-Tariq","The Nightcomer","الطارق",17],
      ["Al-A'la","The Most High","الأعلى",19],
      ["Al-Ghashiyah","The Overwhelming","الغاشية",26],
      ["Al-Fajr","The Dawn","الفجر",30],
      ["Al-Balad","The City","البلد",20],

      ["Al-Layl","The Night","الليل",21],

      ["Ash-Sharh","The Relief","الشرح",8],

      ["Al-Bayyinah","The Clear Proof","البينة",8],
      ["Az-Zalzalah","The Earthquake","الزلزلة",8],
      ["Al-Adiyat","The Courser","العاديات",11],
      ["Al-Qari'ah","The Calamity","القارعة",11],
      ["At-Takathur","Rivalry in World Increase","التكاثر",8],
      ["Al-Asr","The Declining Day","العصر",3],
      ["Al-Humazah","The Traducer","الهمزة",9],
      ["Al-Fil","The Elephant","الفيل",5],
      ["Quraysh","Quraysh","قريش",4],
      ["Al-Ma'un","Small Kindnesses","الماعون",7],
      ["Al-Kawthar","Abundance","الكوثر",3],
      ["Al-Kafirun","The Disbelievers","الكافرون",6],
      ["An-Nasr","Divine Support","النصر",3],
      ["Al-Masad","The Palm Fiber","المسد",5],
      ["Al-Ikhlas","Sincerity","الإخلاص",4],
      ["Al-Falaq","The Daybreak","الفلق",5],
      ["An-Nas","Mankind","الناس",6]
    ];


    let quranText = {};
    let quranLoaded = false;

    let currentSurah = null;
    
    async function loadQuran() {
    
      try {
    
        const response =
          await fetch("quran-uthmani.txt");
    
        if (!response.ok) {
          throw new Error(
            "Could not load Quran text."
          );
        }
    
        const text =
          await response.text();
    
        const verses =
          text
            .replace(/\r/g, "")
            .split("\n")
            .filter(line =>
              line.trim() !== ""
            );
    
    
        if (verses.length !== 6236) {
    
          throw new Error(
            "Expected 6236 ayat but found " +
            verses.length
          );
    
        }
    
    
        let position = 0;
    
    
        surahs.forEach(
          (surah, index) => {
    
            const surahNumber =
              index + 1;
    
            const ayahCount =
              surah[3];
    
            quranText[surahNumber] =
              verses.slice(
                position,
                position + ayahCount
              );
    
            position += ayahCount;
    
          }
        );
    
    
        if (position !== 6236) {
    
          throw new Error(
            "Surah indexing did not total 6236 ayat."
          );
    
        }
    
    
        quranLoaded = true;
    
        console.log(
          "Quran loaded successfully:",
          position,
          "ayat"
        );
    
    
      } catch (error) {
    
        console.error(error);
    
        alert(
          "The Quran text could not be loaded. " +
          "Please check quran-uthmani.txt."
        );
    
      }
    
    }

    const homeScreen =
      document.getElementById("homeScreen");

    const readerScreen =
      document.getElementById("readerScreen");

    const surahList =
      document.getElementById("surahList");

    const continueCard =
      document.getElementById("continueCard");

    const continueTitle =
      document.getElementById("continueTitle");

    const readerTitle =
      document.getElementById("readerTitle");

    const readerArabicName =
      document.getElementById("readerArabicName");

    const ayahContainer =
      document.getElementById("ayahContainer");

    function buildHome() {

      surahList.innerHTML = "";

      surahs.forEach((surah, index) => {

        const number = index + 1;

        const row =
          document.createElement("div");

        row.className = "surah-row";

        row.onclick = () =>
          openSurah(number);

        row.innerHTML = `

          <div class="surah-number">
            ${number}
          </div>

          <div class="surah-text">

            <div class="surah-name">
              ${surah[0]}
            </div>

            <div class="surah-meaning">
              ${surah[1]} · ${surah[3]} Ayat
            </div>

          </div>

          <div class="surah-arabic">
            ${surah[2]}
          </div>

        `;

        surahList.appendChild(row);

      });

      updateContinueCard();

    }


    function openSurah(number) {
      
      if (!quranLoaded) {
      
        alert(
          "Quran text is still loading. Please try again."
        );
      
        return;
      
      }

      currentSurah = number;

      const surah =
        surahs[number - 1];

      localStorage.setItem(
        "lastSurah",
        number
      );

      homeScreen.classList.add("hidden");
      readerScreen.classList.remove("hidden");

      readerTitle.textContent =
        number + ". " + surah[0];

      readerArabicName.textContent =
        surah[2];

      ayahContainer.innerHTML = "";

     const verses =
        quranText[number];


      verses.forEach(
        (verse, index) => {
      
          const ayah =
            document.createElement(
              "article"
            );
      
          ayah.className =
            "ayah";
      
          ayah.dataset.ayah =
            index + 1;
      
          ayah.innerHTML = `
      
            <div class="arabic">
      
              ${verse}
      
              <span class="ayah-number">
                ${index + 1}
              </span>
      
            </div>
      
          `;
      
          ayahContainer.appendChild(
            ayah
          );
      
        }
      );
      
      const savedSurah =
        Number(
          localStorage.getItem(
            "lastPositionSurah"
          )
        );

      const savedPosition =
        Number(
          localStorage.getItem(
            "lastScrollPosition"
          )
        );


      setTimeout(() => {

        if (
          savedSurah === number &&
          savedPosition > 0
        ) {

          window.scrollTo(
            0,
            savedPosition
          );

        } else {

          window.scrollTo(
            0,
            0
          );

        }

      }, 50);

    }


    function saveReadingPosition() {

      if (!currentSurah) {
        return;
      }

      localStorage.setItem(
        "lastPositionSurah",
        currentSurah
      );

      localStorage.setItem(
        "lastScrollPosition",
        window.scrollY
      );

    }


    window.addEventListener(
      "scroll",
      saveReadingPosition
    );


    function goHome() {

      saveReadingPosition();

      currentSurah = null;

      readerScreen.classList.add("hidden");
      homeScreen.classList.remove("hidden");

      window.scrollTo(0, 0);

      updateContinueCard();

    }


    function updateContinueCard() {

      const lastSurah =
        Number(
          localStorage.getItem(
            "lastSurah"
          )
        );


      if (
        lastSurah >= 1 &&
        lastSurah <= 114
      ) {

        const surah =
          surahs[lastSurah - 1];

        continueCard.classList.remove(
          "hidden"
        );

        continueTitle.textContent =
          surah[0] +
          " · Surah " +
          lastSurah;

      } else {

        continueCard.classList.add(
          "hidden"
        );

      }

    }


    function continueReading() {

      const lastSurah =
        Number(
          localStorage.getItem(
            "lastSurah"
          )
        );

      if (lastSurah) {
        openSurah(lastSurah);
      }

    }


    async function startApp() {
    
      await loadQuran();
    
      buildHome();
    
    }
    
    
    startApp();

  </script>

</body>
