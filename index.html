<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />

  <meta
    id="themeColor"
    name="theme-color"
    content="#f6f3ec"
  />

  <title>My Quran Reader</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --background: #f6f3ec;
      --card: #ffffff;
      --text: #1d2925;
      --secondary: #6f7a75;
      --border: #e2ddd2;
      --accent: #315c4b;
      --arabic-font-size: 34px;
    }

    body.dark {
      --background: #111714;
      --card: #19201d;
      --text: #f1f5f2;
      --secondary: #a6b0ab;
      --border: #303a35;
      --accent: #8fc1a8;
    }

    body {
      margin: 0;

      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    button {
      font: inherit;
    }

    .app {
      max-width: 700px;
      margin: auto;

      padding:
        calc(18px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    .hidden {
      display: none !important;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .subtitle {
      color: var(--secondary);
      margin-top: 6px;
      margin-bottom: 22px;
    }

    .continue-card {
      background: var(--accent);
      color: white;

      border-radius: 18px;
      padding: 18px;
      margin-bottom: 14px;

      cursor: pointer;
    }

    .continue-small {
      opacity: 0.8;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .continue-title {
      font-size: 19px;
      font-weight: 600;
    }

    .home-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 22px;
    }

    .home-action-button {
      flex: 1;

      background: var(--card);
      color: var(--text);

      border: 1px solid var(--border);
      border-radius: 16px;

      min-height: 52px;
      padding: 12px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      font-weight: 600;
    }

    .bookmark-count {
      color: var(--secondary);
      font-size: 13px;
    }

    .surah-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .surah-row {
      display: flex;
      align-items: center;
      gap: 14px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 16px;

      padding: 15px;

      cursor: pointer;
    }

    .surah-number {
      width: 38px;
      height: 38px;

      border: 1px solid var(--border);
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 14px;
      flex-shrink: 0;
    }

    .surah-text {
      flex: 1;
    }

    .surah-name {
      font-size: 17px;
      font-weight: 600;
    }

    .surah-meaning {
      color: var(--secondary);
      font-size: 13px;
      margin-top: 3px;
    }

    .surah-arabic {
      direction: rtl;

      font-size: 24px;

      font-family:
        "Geeza Pro",
        "Noto Naskh Arabic",
        serif;
    }

    .reader-top,
    .bookmarks-top {
      display: flex;
      align-items: center;
      gap: 12px;

      position: sticky;
      top: 0;
      z-index: 100;

      background: var(--background);

      padding:
        calc(8px + env(safe-area-inset-top))
        0
        12px;

      margin-bottom: 20px;
    }

    .back-button,
    .reader-settings-button {
      background: var(--card);
      color: var(--text);

      width: 44px;
      height: 44px;

      border-radius: 50%;
      border: 1px solid var(--border);

      line-height: 1;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
      cursor: pointer;
    }

    .back-button {
      font-size: 28px;
    }

    .reader-settings-button {
      font-size: 20px;
    }

    .reader-heading,
    .bookmarks-heading {
      flex: 1;
      min-width: 0;
    }

    .reader-arabic-name {
      direction: rtl;
      color: var(--secondary);
      margin-top: 3px;
    }

    .ayah {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 22px 18px 14px;
      margin-bottom: 14px;

      scroll-margin-top: 90px;
    }

    .arabic {
      direction: rtl;
      text-align: right;

      font-family:
        "Geeza Pro",
        "Noto Naskh Arabic",
        serif;

      font-size: var(--arabic-font-size);
      line-height: 2;
    }

    .ayah-number {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      width: 30px;
      height: 30px;

      border: 1px solid var(--border);
      border-radius: 50%;

      font-family:
        -apple-system,
        sans-serif;

      font-size: 12px;

      margin-right: 7px;
    }

    .ayah-actions {
      display: flex;
      justify-content: flex-start;

      border-top: 1px solid var(--border);

      margin-top: 14px;
      padding-top: 10px;
    }

    .bookmark-button {
      border: 0;
      background: transparent;
      color: var(--secondary);

      width: 44px;
      height: 44px;

      border-radius: 12px;

      font-size: 24px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
    }

    .bookmark-button.saved {
      color: var(--accent);
    }

    .bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .bookmark-row {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 16px;

      padding: 16px;

      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bookmark-row-main {
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }

    .bookmark-row-title {
      font-size: 17px;
      font-weight: 600;
    }

    .bookmark-row-subtitle {
      margin-top: 4px;

      color: var(--secondary);
      font-size: 14px;
    }

    .bookmark-row-arabic {
      direction: rtl;

      margin-top: 8px;

      color: var(--secondary);

      font-size: 20px;

      font-family:
        "Geeza Pro",
        "Noto Naskh Arabic",
        serif;
    }

    .bookmark-delete {
      width: 44px;
      height: 44px;

      flex-shrink: 0;

      border: 1px solid var(--border);
      background: var(--card);
      color: var(--secondary);

      border-radius: 50%;

      font-size: 20px;

      cursor: pointer;
    }

    .empty-bookmarks {
      text-align: center;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: 18px;

      padding: 32px 20px;

      color: var(--secondary);
    }

    .empty-bookmarks-symbol {
      font-size: 36px;

      margin-bottom: 12px;

      color: var(--accent);
    }

    /* SETTINGS */

    .settings-overlay {
      position: fixed;
      inset: 0;

      z-index: 1000;

      background: rgba(0, 0, 0, 0.45);

      display: flex;
      align-items: flex-end;
      justify-content: center;

      padding:
        16px
        16px
        calc(16px + env(safe-area-inset-bottom));
    }

    .settings-panel {
      width: 100%;
      max-width: 700px;

      background: var(--card);
      color: var(--text);

      border: 1px solid var(--border);

      border-radius: 24px;

      padding: 20px;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 24px;
    }

    .settings-header h2 {
      margin: 0;
      font-size: 24px;
    }

    .settings-close {
      width: 40px;
      height: 40px;

      border: 1px solid var(--border);
      border-radius: 50%;

      background: var(--background);
      color: var(--text);

      font-size: 22px;

      cursor: pointer;
    }

    .settings-section {
      border-top: 1px solid var(--border);
      padding: 18px 0;
    }

    .settings-section:first-of-type {
      border-top: 0;
      padding-top: 0;
    }

    .settings-label {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .settings-description {
      color: var(--secondary);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .font-control-button {
      width: 52px;
      height: 46px;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: var(--background);
      color: var(--text);

      font-size: 18px;
      font-weight: 600;

      cursor: pointer;
    }

    .font-size-value {
      flex: 1;

      text-align: center;

      color: var(--secondary);
      font-size: 14px;
    }

    .theme-row {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 16px;
    }

    .theme-text {
      flex: 1;
    }

    .switch {
      position: relative;

      width: 52px;
      height: 32px;

      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;

      background: var(--border);

      border-radius: 999px;

      cursor: pointer;

      transition: 0.2s;
    }

    .slider::before {
      content: "";

      position: absolute;

      width: 26px;
      height: 26px;

      left: 3px;
      top: 3px;

      background: white;

      border-radius: 50%;

      transition: 0.2s;
    }

    .switch input:checked + .slider {
      background: var(--accent);
    }

    .switch input:checked + .slider::before {
      transform: translateX(20px);
    }

    .reset-button {
      width: 100%;

      border: 1px solid var(--border);

      border-radius: 14px;

      background: var(--background);
      color: var(--text);

      padding: 13px;

      cursor: pointer;
    }

    .source-footer {
      text-align: center;

      color: var(--secondary);

      font-size: 12px;
      line-height: 1.6;

      margin-top: 35px;
      padding: 20px;
    }

    .source-footer a {
      color: var(--accent);
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- HOME SCREEN -->

    <section id="homeScreen">

      <h1>Quran</h1>

      <div class="subtitle">
        Choose a Surah to begin reading
      </div>


      <div
        id="continueCard"
        class="continue-card hidden"
        onclick="continueReading()"
      >

        <div class="continue-small">
          Continue Reading
        </div>

        <div
          id="continueTitle"
          class="continue-title"
        ></div>

      </div>


      <div class="home-actions">

        <button
          class="home-action-button"
          onclick="openBookmarks()"
        >
          <span>★</span>

          <span>
            Bookmarks
          </span>

          <span
            id="bookmarkCount"
            class="bookmark-count"
          >
            0 saved
          </span>
        </button>


        <button
          class="home-action-button"
          onclick="openSettings()"
        >
          <span>⚙︎</span>
          <span>Settings</span>
        </button>

      </div>


      <div
        id="surahList"
        class="surah-list"
      ></div>

    </section>


    <!-- READER SCREEN -->

    <section
      id="readerScreen"
      class="hidden"
    >

      <div class="reader-top">

        <button
          class="back-button"
          onclick="goHome()"
          aria-label="Back to Surah list"
        >
          ‹
        </button>


        <div class="reader-heading">

          <h1 id="readerTitle">
            Surah
          </h1>

          <div
            id="readerArabicName"
            class="reader-arabic-name"
          ></div>

        </div>


        <button
          class="reader-settings-button"
          onclick="openSettings()"
          aria-label="Reader settings"
        >
          ⚙︎
        </button>

      </div>


      <div id="ayahContainer"></div>

    </section>


    <!-- BOOKMARKS SCREEN -->

    <section
      id="bookmarksScreen"
      class="hidden"
    >

      <div class="bookmarks-top">

        <button
          class="back-button"
          onclick="closeBookmarks()"
          aria-label="Back to Surah list"
        >
          ‹
        </button>


        <div class="bookmarks-heading">
          <h1>Bookmarks</h1>
        </div>

      </div>


      <div
        id="bookmarkList"
        class="bookmark-list"
      ></div>

    </section>


    <footer class="source-footer">

      Quran text source:

      <a
        href="https://tanzil.net"
        target="_blank"
        rel="noopener"
      >
        Tanzil Project
      </a>

      <br>

      Tanzil Quran Text
      © 2007–2021 Tanzil Project

    </footer>

  </main>


  <!-- SETTINGS PANEL -->

  <div
    id="settingsOverlay"
    class="settings-overlay hidden"
    onclick="closeSettings()"
  >

    <div
      class="settings-panel"
      onclick="event.stopPropagation()"
    >

      <div class="settings-header">

        <h2>Reader Settings</h2>

        <button
          class="settings-close"
          onclick="closeSettings()"
          aria-label="Close settings"
        >
          ×
        </button>

      </div>


      <div class="settings-section">

        <div class="settings-label">
          Arabic text size
        </div>

        <div class="settings-description">
          Adjust the size of Quranic Arabic text.
        </div>


        <div class="font-controls">

          <button
            class="font-control-button"
            onclick="changeArabicFontSize(-2)"
            aria-label="Decrease Arabic font size"
          >
            A−
          </button>


          <div
            id="fontSizeValue"
            class="font-size-value"
          >
            34 px
          </div>


          <button
            class="font-control-button"
            onclick="changeArabicFontSize(2)"
            aria-label="Increase Arabic font size"
          >
            A+
          </button>

        </div>

      </div>


      <div class="settings-section">

        <div class="theme-row">

          <div class="theme-text">

            <div class="settings-label">
              Dark mode
            </div>

            <div class="settings-description">
              Use a darker theme for nighttime reading.
            </div>

          </div>


          <label class="switch">

            <input
              id="darkModeToggle"
              type="checkbox"
              onchange="setDarkMode(this.checked)"
            />

            <span class="slider"></span>

          </label>

        </div>

      </div>


      <div class="settings-section">

        <button
          class="reset-button"
          onclick="resetReaderSettings()"
        >
          Reset reader settings
        </button>

      </div>

    </div>

  </div>

    const continueCard =
      document.getElementById(
        "continueCard"
      );

    const continueTitle =
      document.getElementById(
        "continueTitle"
      );

    const bookmarkCount =
      document.getElementById(
        "bookmarkCount"
      );

    const bookmarkList =
      document.getElementById(
        "bookmarkList"
      );

    const readerTitle =
      document.getElementById(
        "readerTitle"
      );

    const readerArabicName =
      document.getElementById(
        "readerArabicName"
      );

    const ayahContainer =
      document.getElementById(
        "ayahContainer"
      );

    const settingsOverlay =
      document.getElementById(
        "settingsOverlay"
      );

    const fontSizeValue =
      document.getElementById(
        "fontSizeValue"
      );

    const darkModeToggle =
      document.getElementById(
        "darkModeToggle"
      );

    const themeColor =
      document.getElementById(
        "themeColor"
      );


    /*
      READER SETTINGS
    */

    function loadReaderSettings() {

      const savedFontSize =
        Number(
          localStorage.getItem(
            "quranArabicFontSize"
          )
        );


      if (
        savedFontSize >= MIN_FONT_SIZE &&
        savedFontSize <= MAX_FONT_SIZE
      ) {

        arabicFontSize =
          savedFontSize;

      } else {

        arabicFontSize =
          DEFAULT_FONT_SIZE;

      }


      const darkMode =
        localStorage.getItem(
          "quranDarkMode"
        ) === "true";


      applyArabicFontSize();

      setDarkMode(
        darkMode,
        false
      );

    }


    function applyArabicFontSize() {

      document.documentElement.style.setProperty(
        "--arabic-font-size",
        arabicFontSize + "px"
      );


      fontSizeValue.textContent =
        arabicFontSize + " px";

    }


    function changeArabicFontSize(
      amount
    ) {

      /*
        Save the current ayah first because
        changing font size causes text to reflow.
      */
      saveReadingPosition();


      arabicFontSize +=
        amount;


      if (
        arabicFontSize < MIN_FONT_SIZE
      ) {

        arabicFontSize =
          MIN_FONT_SIZE;

      }


      if (
        arabicFontSize > MAX_FONT_SIZE
      ) {

        arabicFontSize =
          MAX_FONT_SIZE;

      }


      localStorage.setItem(
        "quranArabicFontSize",
        arabicFontSize
      );


      applyArabicFontSize();

    }


    function setDarkMode(
      enabled,
      save = true
    ) {

      document.body.classList.toggle(
        "dark",
        enabled
      );


      darkModeToggle.checked =
        enabled;


      themeColor.setAttribute(
        "content",
        enabled
          ? "#111714"
          : "#f6f3ec"
      );


      if (save) {

        localStorage.setItem(
          "quranDarkMode",
          enabled
        );

      }

    }


    function resetReaderSettings() {

      arabicFontSize =
        DEFAULT_FONT_SIZE;


      localStorage.removeItem(
        "quranArabicFontSize"
      );


      localStorage.removeItem(
        "quranDarkMode"
      );


      applyArabicFontSize();

      setDarkMode(
        false,
        false
      );

    }


    function openSettings() {

      /*
        Keep Continue Reading up to date if
        Settings is opened while reading.
      */
      saveReadingPosition();


      fontSizeValue.textContent =
        arabicFontSize + " px";


      darkModeToggle.checked =
        document.body.classList.contains(
          "dark"
        );


      settingsOverlay.classList.remove(
        "hidden"
      );

    }


    function closeSettings() {

      settingsOverlay.classList.add(
        "hidden"
      );

    }


    /*
      QURAN DATA
    */

    async function loadQuran() {

      try {

        const response =
          await fetch(
            "quran-uthmani.txt"
          );


        if (!response.ok) {

          throw new Error(
            "Could not load Quran text."
          );

        }


        const text =
          await response.text();


        const verses =
          text
            .replace(/\r/g, "")
            .split("\n")
            .map(
              line =>
                line.trim()
            )
            .filter(
              line =>
                /^\d+\|\d+\|/.test(
                  line
                )
            )
            .map(
              line => {

                const parts =
                  line.split("|");


                return {

                  surah:
                    Number(
                      parts[0]
                    ),

                  ayah:
                    Number(
                      parts[1]
                    ),

                  text:
                    parts
                      .slice(2)
                      .join("|")

                };

              }
            );


        if (
          verses.length !== 6236
        ) {

          throw new Error(
            "Expected 6236 ayat but found " +
            verses.length
          );

        }


        for (
          let surahNumber = 1;
          surahNumber <= 114;
          surahNumber++
        ) {

          quranText[surahNumber] =
            verses
              .filter(
                verse =>
                  verse.surah ===
                  surahNumber
              )
              .sort(
                (a, b) =>
                  a.ayah - b.ayah
              )
              .map(
                verse =>
                  verse.text
              );

        }


        for (
          let i = 0;
          i < surahs.length;
          i++
        ) {

          const expected =
            surahs[i][3];


          const actual =
            quranText[
              i + 1
            ].length;


          if (
            actual !== expected
          ) {

            throw new Error(
              "Surah " +
              (i + 1) +
              " expected " +
              expected +
              " ayat but found " +
              actual
            );

          }

        }


        quranLoaded =
          true;


      } catch (error) {

        console.error(
          error
        );


        alert(
          "The Quran text could not be loaded. " +
          "Please check quran-uthmani.txt."
        );

      }

    }


    /*
      BOOKMARK STORAGE
    */

    function getBookmarks() {

      try {

        const saved =
          localStorage.getItem(
            "quranBookmarks"
          );


        if (!saved) {
          return [];
        }


        const bookmarks =
          JSON.parse(
            saved
          );


        if (
          !Array.isArray(
            bookmarks
          )
        ) {

          return [];

        }


        return bookmarks.filter(
          bookmark =>
            bookmark &&
            Number(
              bookmark.surah
            ) >= 1 &&
            Number(
              bookmark.surah
            ) <= 114 &&
            Number(
              bookmark.ayah
            ) >= 1
        );


      } catch (error) {

        console.error(
          "Could not read bookmarks:",
          error
        );


        return [];

      }

    }


    function saveBookmarks(
      bookmarks
    ) {

      localStorage.setItem(
        "quranBookmarks",
        JSON.stringify(
          bookmarks
        )
      );


      updateBookmarkCount();

    }


    function isBookmarked(
      surah,
      ayah
    ) {

      return getBookmarks().some(
        bookmark =>
          Number(
            bookmark.surah
          ) === Number(surah) &&
          Number(
            bookmark.ayah
          ) === Number(ayah)
      );

    }


    function toggleBookmark(
      surah,
      ayah
    ) {

      let bookmarks =
        getBookmarks();


      const index =
        bookmarks.findIndex(
          bookmark =>
            Number(
              bookmark.surah
            ) === Number(surah) &&
            Number(
              bookmark.ayah
            ) === Number(ayah)
        );


      if (
        index >= 0
      ) {

        bookmarks.splice(
          index,
          1
        );

      } else {

        bookmarks.push({

          surah:
            Number(surah),

          ayah:
            Number(ayah)

        });

      }


      bookmarks.sort(
        (a, b) => {

          if (
            a.surah !==
            b.surah
          ) {

            return (
              a.surah -
              b.surah
            );

          }


          return (
            a.ayah -
            b.ayah
          );

        }
      );


      saveBookmarks(
        bookmarks
      );


      updateAyahBookmarkButton(
        surah,
        ayah
      );

    }


    function removeBookmark(
      surah,
      ayah
    ) {

      const bookmarks =
        getBookmarks()
          .filter(
            bookmark =>
              !(
                Number(
                  bookmark.surah
                ) ===
                  Number(surah) &&

                Number(
                  bookmark.ayah
                ) ===
                  Number(ayah)
              )
          );


      saveBookmarks(
        bookmarks
      );


      renderBookmarks();

    }


    function updateBookmarkCount() {

      const bookmarks =
        getBookmarks();


      bookmarkCount.textContent =
        bookmarks.length === 1
          ? "1 saved"
          : bookmarks.length +
            " saved";

    }


    function updateAyahBookmarkButton(
      surah,
      ayah
    ) {

      const button =
        document.querySelector(
          `.bookmark-button[data-surah="${surah}"][data-ayah="${ayah}"]`
        );


      if (!button) {
        return;
      }


      const saved =
        isBookmarked(
          surah,
          ayah
        );


      button.textContent =
        saved
          ? "★"
          : "☆";


      button.classList.toggle(
        "saved",
        saved
      );


      button.setAttribute(
        "aria-label",

        saved
          ? `Remove bookmark for Surah ${surah}, Ayah ${ayah}`
          : `Bookmark Surah ${surah}, Ayah ${ayah}`
      );

    }


    /*
      HOME
    */

    function buildHome() {

      surahList.innerHTML =
        "";


      surahs.forEach(
        (surah, index) => {

          const number =
            index + 1;


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "surah-row";


          row.onclick =
            () =>
              openSurah(
                number
              );


          row.innerHTML = `

            <div class="surah-number">
              ${number}
            </div>

            <div class="surah-text">

              <div class="surah-name">
                ${surah[0]}
              </div>

              <div class="surah-meaning">
                ${surah[1]} · ${surah[3]} Ayat
              </div>

            </div>

            <div class="surah-arabic">
              ${surah[2]}
            </div>

          `;


          surahList.appendChild(
            row
          );

        }
      );


      updateContinueCard();

      updateBookmarkCount();

    }


    /*
      READER
    */

    function openSurah(
      number,
      addHistory = true,
      targetAyah = null
    ) {

      if (!quranLoaded) {

        alert(
          "Quran text is still loading. Please try again."
        );


        return;

      }


      const surah =
        surahs[
          number - 1
        ];


      if (!surah) {
        return;
      }


      let openingAyah =
        Number(
          targetAyah
        );


      if (
        !openingAyah ||
        openingAyah < 1 ||
        openingAyah >
          surah[3]
      ) {

        openingAyah =
          Number(
            localStorage.getItem(
              "lastAyah_" +
              number
            )
          ) || 1;

      }


      currentSurah =
        number;


      currentAyah =
        openingAyah;


      localStorage.setItem(
        "lastSurah",
        number
      );


      localStorage.setItem(
        "lastAyah_" +
          number,
        openingAyah
      );


      if (
        addHistory
      ) {

        history.pushState(

          {
            screen:
              "reader",

            surah:
              number,

            ayah:
              openingAyah
          },

          "",

          "#surah-" +
            number +
            "-ayah-" +
            openingAyah

        );

      }


      homeScreen.classList.add(
        "hidden"
      );


      bookmarksScreen.classList.add(
        "hidden"
      );


      readerScreen.classList.remove(
        "hidden"
      );


      readerTitle.textContent =
        number +
        ". " +
        surah[0];


      readerArabicName.textContent =
        surah[2];


      ayahContainer.innerHTML =
        "";


      const verses =
        quranText[
          number
        ];


      verses.forEach(
        (verse, index) => {

          const ayahNumber =
            index + 1;


          const ayah =
            document.createElement(
              "article"
            );


          ayah.className =
            "ayah";


          ayah.dataset.ayah =
            ayahNumber;


          const saved =
            isBookmarked(
              number,
              ayahNumber
            );


          ayah.innerHTML = `

            <div class="arabic">

              ${verse}

              <span class="ayah-number">
                ${ayahNumber}
              </span>

            </div>


            <div class="ayah-actions">

              <button
                class="bookmark-button ${saved ? "saved" : ""}"
                data-surah="${number}"
                data-ayah="${ayahNumber}"
                onclick="toggleBookmark(${number}, ${ayahNumber})"
                aria-label="${
                  saved
                    ? `Remove bookmark for Surah ${number}, Ayah ${ayahNumber}`
                    : `Bookmark Surah ${number}, Ayah ${ayahNumber}`
                }"
              >
                ${saved ? "★" : "☆"}
              </button>

            </div>

          `;


          ayahContainer.appendChild(
            ayah
          );

        }
      );


      setTimeout(
        () => {

          const target =
            document.querySelector(
              `.ayah[data-ayah="${openingAyah}"]`
            );


          if (target) {

            target.scrollIntoView({

              behavior:
                "auto",

              block:
                "start"

            });

          } else {

            window.scrollTo(
              0,
              0
            );

          }

        },

        100
      );

    }


    function saveReadingPosition() {

      if (
        !currentSurah
      ) {

        return;

      }


      const ayahs =
        document.querySelectorAll(
          ".ayah"
        );


      if (
        !ayahs.length
      ) {

        return;

      }


      let visibleAyah =
        currentAyah ||
        1;


      const readingLine =
        180;


      for (
        const ayah of ayahs
      ) {

        const rect =
          ayah.getBoundingClientRect();


        if (
          rect.top <=
            readingLine &&
          rect.bottom > 0
        ) {

          visibleAyah =
            Number(
              ayah.dataset.ayah
            );


        } else if (
          rect.top >
          readingLine
        ) {

          break;

        }

      }


      currentAyah =
        visibleAyah;


      localStorage.setItem(
        "lastSurah",
        currentSurah
      );


      localStorage.setItem(
        "lastAyah_" +
          currentSurah,
        currentAyah
      );


      if (
        history.state &&
        history.state.screen ===
          "reader"
      ) {

        history.replaceState(

          {
            screen:
              "reader",

            surah:
              currentSurah,

            ayah:
              currentAyah
          },

          "",

          "#surah-" +
            currentSurah +
            "-ayah-" +
            currentAyah

        );

      }

    }


    window.addEventListener(
      "scroll",
      () => {

        clearTimeout(
          scrollTimer
        );


        scrollTimer =
          setTimeout(
            saveReadingPosition,
            100
          );

      }
    );


    /*
      HOME NAVIGATION
    */

    function showHome() {

      saveReadingPosition();


      currentSurah =
        null;


      readerScreen.classList.add(
        "hidden"
      );


      bookmarksScreen.classList.add(
        "hidden"
      );


      homeScreen.classList.remove(
        "hidden"
      );


      window.scrollTo(
        0,
        0
      );


      updateContinueCard();

      updateBookmarkCount();

    }


    /*
      CUSTOM ‹ BUTTON

      Directly goes Home and replaces the
      reader history entry.
    */

    function goHome() {

      showHome();


      history.replaceState(

        {
          screen:
            "home"
        },

        "",

        window.location.pathname

      );

    }


    /*
      BOOKMARKS SCREEN
    */

    function openBookmarks(
      addHistory = true
    ) {

      saveReadingPosition();


      currentSurah =
        null;


      if (
        addHistory
      ) {

        history.pushState(

          {
            screen:
              "bookmarks"
          },

          "",

          "#bookmarks"

        );

      }


      homeScreen.classList.add(
        "hidden"
      );


      readerScreen.classList.add(
        "hidden"
      );


      bookmarksScreen.classList.remove(
        "hidden"
      );


      renderBookmarks();


      window.scrollTo(
        0,
        0
      );

    }


    function closeBookmarks() {

      showHome();


      history.replaceState(

        {
          screen:
            "home"
        },

        "",

        window.location.pathname

      );

    }


    function renderBookmarks() {

      const bookmarks =
        getBookmarks();


      bookmarkList.innerHTML =
        "";


      updateBookmarkCount();


      if (
        !bookmarks.length
      ) {

        bookmarkList.innerHTML = `

          <div class="empty-bookmarks">

            <div class="empty-bookmarks-symbol">
              ☆
            </div>

            <strong>
              No bookmarks yet
            </strong>

            <br><br>

            Open a Surah and tap the
            ☆ button beneath any ayah
            to save it here.

          </div>

        `;


        return;

      }


      bookmarks.forEach(
        bookmark => {

          const surah =
            surahs[
              bookmark.surah -
              1
            ];


          if (!surah) {
            return;
          }


          const row =
            document.createElement(
              "div"
            );


          row.className =
            "bookmark-row";


          row.innerHTML = `

            <div
              class="bookmark-row-main"
              onclick="openBookmark(${bookmark.surah}, ${bookmark.ayah})"
            >

              <div class="bookmark-row-title">
                ${surah[0]} · Ayah ${bookmark.ayah}
              </div>

              <div class="bookmark-row-subtitle">
                Surah ${bookmark.surah}
              </div>

              <div class="bookmark-row-arabic">
                ${surah[2]}
              </div>

            </div>


            <button
              class="bookmark-delete"
              onclick="removeBookmark(${bookmark.surah}, ${bookmark.ayah})"
              aria-label="Remove ${surah[0]} Ayah ${bookmark.ayah} bookmark"
            >
              ×
            </button>

          `;


          bookmarkList.appendChild(
            row
          );

        }
      );

    }


    function openBookmark(
      surah,
      ayah
    ) {

      openSurah(
        surah,
        true,
        ayah
      );

    }


    /*
      SAFARI BACK + LEFT EDGE SWIPE
    */

    window.addEventListener(
      "popstate",
      event => {

        /*
          Close the settings overlay first
          if it happens to be open.
        */
        closeSettings();


        if (
          event.state &&
          event.state.screen ===
            "reader"
        ) {

          const surah =
            Number(
              event.state.surah
            );


          const ayah =
            Number(
              event.state.ayah
            ) || null;


          openSurah(
            surah,
            false,
            ayah
          );


        } else if (
          event.state &&
          event.state.screen ===
            "bookmarks"
        ) {

          openBookmarks(
            false
          );


        } else {

          showHome();

        }

      }
    );


    /*
      CONTINUE READING
    */

    function updateContinueCard() {

      const lastSurah =
        Number(
          localStorage.getItem(
            "lastSurah"
          )
        );


      if (
        lastSurah >= 1 &&
        lastSurah <= 114
      ) {

        const surah =
          surahs[
            lastSurah - 1
          ];


        const lastAyah =
          Number(
            localStorage.getItem(
              "lastAyah_" +
              lastSurah
            )
          ) || 1;


        continueCard.classList.remove(
          "hidden"
        );


        continueTitle.textContent =
          surah[0] +
          " · Ayah " +
          lastAyah;


      } else {

        continueCard.classList.add(
          "hidden"
        );

      }

    }


    function continueReading() {

      const lastSurah =
        Number(
          localStorage.getItem(
            "lastSurah"
          )
        );


      if (
        lastSurah >= 1 &&
        lastSurah <= 114
      ) {

        const lastAyah =
          Number(
            localStorage.getItem(
              "lastAyah_" +
              lastSurah
            )
          ) || 1;


        openSurah(
          lastSurah,
          true,
          lastAyah
        );

      }

    }


    /*
      STARTUP
    */

    async function startApp() {

      /*
        Load visual preferences first so
        the correct theme appears immediately.
      */

      loadReaderSettings();


      history.replaceState(

        {
          screen:
            "home"
        },

        "",

        window.location.pathname

      );


      /*
        Remove old pixel-based reading progress.
      */

      localStorage.removeItem(
        "lastPositionSurah"
      );


      localStorage.removeItem(
        "lastScrollPosition"
      );


      await loadQuran();


      buildHome();

    }


    startApp();

  </script>

</body>
</html>
